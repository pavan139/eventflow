[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eventflow"
version = "0.1.0"
description = "Event-time windows, durable watermarks and transactional local sink recovery"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
eventflow = "eventflow.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
